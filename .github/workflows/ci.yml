# Every job starts the local mock provider (in-process, via test/run-example.mjs)
# and runs one language end to end against it. No secrets are used or needed.
# Actions are pinned to full commit SHAs (the tag is in the comment).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  javascript:
    name: javascript (mock, SDK, html-sdk, WordPress, Node example)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: node --test test/mock.test.mjs test/sdk.test.mjs test/html-sdk.test.mjs test/wordpress.test.mjs test/profile.test.mjs
      - run: node test/run-example.mjs node-openid-client

  # What the publish workflow uploads, built the same way on every push: one
  # version everywhere, the npm file list, PyPI metadata (twine check) and a
  # crate that builds from its own .crate file.
  packages:
    name: packages (versions, npm pack, Python build, cargo package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node test/check-versions.mjs
      - run: npm pack --dry-run
        working-directory: packages/node
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Python sdist and wheel
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install --quiet build==1.6.1 twine==7.0.0
          "$RUNNER_TEMP/build/bin/python" -m build packages/python --outdir "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/build/bin/python" -m twine check --strict "$RUNNER_TEMP"/dist/*
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - run: cargo package --locked --manifest-path packages/rust/Cargo.toml --target-dir test/.build/rust-package

  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/nextjs-authjs/package-lock.json
      - run: node test/run-example.mjs nextjs-authjs

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: python -m venv "$RUNNER_TEMP/venv"
      - run: node test/run-example.mjs python-flask-authlib
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python
      - name: profile_from_claims against the shared cases
        run: '"$RUNNER_TEMP/venv/bin/python" -B -m unittest discover -s packages/python/tests -p test_profile.py'
      - name: JupyterHub GenericOAuthenticator config against the mock
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q --require-hashes -r docs/integrations/jupyterhub/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" docs/integrations/jupyterhub/test_against_mock.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - run: cargo test --locked --manifest-path packages/rust/Cargo.toml --target-dir test/.build/rust
      - run: node test/run-example.mjs rust-axum
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/test/.build/rust

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            packages/go/go.sum
            examples/go-nethttp/go.sum
      - name: package tests
        working-directory: packages/go
        run: |
          go vet ./...
          go test -race ./...
      - run: node test/run-example.mjs go-nethttp

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: openssl, curl, json, session
          tools: composer:2.10.3
          coverage: none
      - run: node test/run-example.mjs php-plain
        env:
          COMPOSER_NO_INTERACTION: "1"
      - name: Profile::fromClaims against the shared cases
        run: php packages/php/tests/ProfileTest.php

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --version
      - run: node test/run-example.mjs java-spring-boot

  ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          working-directory: examples/ruby-sinatra
          bundler: Gemfile.lock
          bundler-cache: false
      - run: node test/run-example.mjs ruby-sinatra

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: examples/dotnet-aspnetcore/global.json
      - run: node test/run-example.mjs dotnet-aspnetcore
