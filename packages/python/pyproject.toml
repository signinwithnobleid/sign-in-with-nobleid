[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nobleid-signin"
version = "0.1.0"
description = "Thin helper for Sign in with NobleID (OpenID Connect) on top of Authlib."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "NobleID" }]
keywords = ["nobleid", "openid-connect", "oidc", "oauth2", "pkce", "sign-in", "orcid", "researcher"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
]
dependencies = ["Authlib>=1.7.1,<2", "requests>=2.33,<3"]

[project.urls]
Homepage = "https://github.com/signinwithnobleid/sign-in-with-nobleid"
Documentation = "https://github.com/signinwithnobleid/sign-in-with-nobleid/tree/main/docs"
Source = "https://github.com/signinwithnobleid/sign-in-with-nobleid/tree/main/packages/python"
Issues = "https://github.com/signinwithnobleid/sign-in-with-nobleid/issues"

[project.optional-dependencies]
flask = ["Flask>=3.1.3,<4"]

[tool.setuptools.packages.find]
where = ["src"]
