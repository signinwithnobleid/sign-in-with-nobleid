[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nobleid-signin"
version = "1.0.0"
description = "Thin helper for Sign in with NobleID (OpenID Connect) on top of Authlib."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["Authlib>=1.7.1,<2", "requests>=2.33,<3"]

[project.optional-dependencies]
flask = ["Flask>=3.1.3,<4"]

[tool.setuptools.packages.find]
where = ["src"]
