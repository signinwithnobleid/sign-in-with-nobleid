[package]
name = "nobleid-signin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Server-side helper for Sign in with NobleID, built on the openidconnect crate."
readme = "README.md"
authors = ["NobleID"]
repository = "https://github.com/signinwithnobleid/sign-in-with-nobleid"
homepage = "https://github.com/signinwithnobleid/sign-in-with-nobleid/tree/main/packages/rust"
documentation = "https://docs.rs/nobleid-signin"
keywords = ["nobleid", "openid", "oidc", "oauth2", "orcid"]
categories = ["authentication", "web-programming"]
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "nobleid_signin"
path = "src/lib.rs"

[dependencies]
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
url = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
